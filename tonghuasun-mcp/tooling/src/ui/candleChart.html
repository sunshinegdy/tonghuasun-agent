<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>同花顺 K 线</title>
    <style>/*__WIDGET_CSS__*/</style>
  </head>
  <body>
    <main class="widget-shell" aria-live="polite">
      <header class="quote-header">
        <div class="identity">
          <div class="title-row">
            <h1 id="security-name">iFinD 行情</h1>
            <span id="security-code" class="security-code">—</span>
          </div>
          <div class="price-row">
            <strong id="latest-price">—</strong>
            <span id="price-change" class="price-change neutral">—</span>
          </div>
          <div id="latest-time" class="latest-time">等待行情数据</div>
        </div>
        <div class="toolbar" aria-label="图表控制">
          <div id="periods" class="periods"></div>
          <button id="toggle-ma" class="tool-button active" type="button" aria-pressed="true">MA</button>
          <button id="refresh" class="tool-button" type="button">刷新</button>
        </div>
      </header>

      <section class="stat-grid" aria-label="行情摘要">
        <div><span>开</span><strong id="stat-open">—</strong></div>
        <div><span>高</span><strong id="stat-high">—</strong></div>
        <div><span>低</span><strong id="stat-low">—</strong></div>
        <div><span>成交量</span><strong id="stat-volume">—</strong></div>
        <div><span>成交额</span><strong id="stat-amount">—</strong></div>
      </section>

      <section class="chart-panel">
        <div class="legend" aria-hidden="true">
          <span class="legend-candle">K 线</span>
          <span class="legend-ma5">MA5</span>
          <span class="legend-ma10">MA10</span>
          <span class="legend-ma20">MA20</span>
          <span class="legend-volume">成交量</span>
        </div>
        <div id="chart" class="chart" role="img" aria-label="证券 K 线、成交量和移动平均线图"></div>
        <div id="loading" class="status-overlay">正在加载同花顺行情…</div>
      </section>

      <footer>
        <span id="data-status">iFinD 官方数据接口</span>
        <span>红涨绿跌</span>
      </footer>
    </main>
    <script>/*__WIDGET_SCRIPT__*/</script>
  </body>
</html>
